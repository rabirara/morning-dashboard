<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お店マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#f7f5f0;--card:#ffffff;--border:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.2);
  --text:#1a1a18;--text-s:#5a5a55;--text-t:#9a9990;--surf:#f0efe9;
  --accent:#c0392b;--accent-light:#fdecea;--accent-text:#922b21;
  --blue:#2471a3;--blue-light:#eaf2fb;--blue-text:#1a5276;
  --green:#1e8449;--green-light:#eafaf1;--green-text:#145a32;
  --amber:#d68910;--amber-light:#fef9e7;--amber-text:#9a6208;
  --purple:#7d3c98;--purple-light:#f5eef8;--purple-text:#5b2c6f;
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181600;--card:#242420;--border:rgba(255,255,255,0.1);--border-mid:rgba(255,255,255,0.2);
  --text:#e8e6de;--text-s:#a8a69e;--text-t:#68665e;--surf:#2a2a26;
  --accent:#e74c3c;--accent-light:#3b1414;--accent-text:#f1948a;
  --blue:#5dade2;--blue-light:#1a2e42;--blue-text:#85c1e9;
  --green:#52be80;--green-light:#0e2d1a;--green-text:#82e0aa;
  --amber:#f0b040;--amber-light:#2d1f05;--amber-text:#f8c471;
  --purple:#af7ac5;--purple-light:#2d1b3d;--purple-text:#c39bd3;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ヘッダー */
#header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;flex-shrink:0;z-index:1000}
#header-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#app-title{font-size:16px;font-weight:700;color:var(--accent)}
#loc-btn{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
#loc-btn:hover{background:var(--accent-light)}
#loc-btn.active{background:var(--accent);color:#fff}

/* フィルターエリア */
#filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fbtn{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{background:var(--surf)}
.fbtn.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text)}
.fbtn.on.wed{border-color:var(--blue);background:var(--blue-light);color:var(--blue-text)}
.fbtn.on.sun{border-color:var(--green);background:var(--green-light);color:var(--green-text)}
.fbtn.on.unvisited{border-color:var(--purple);background:var(--purple-light);color:var(--purple-text)}
.star-filter{display:flex;gap:3px;align-items:center}
.sfbtn{font-size:12px;padding:3px 7px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;transition:all .15s}
.sfbtn:hover{background:var(--surf)}
.sfbtn.on{border-color:var(--amber);background:var(--amber-light);color:var(--amber-text)}
#filter-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.rbtn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;transition:all .15s;white-space:nowrap}
.rbtn:hover{background:var(--surf)}
.rbtn.active{background:#1a5276;color:#fff;border-color:#1a5276}

/* メイン */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map{flex:1;z-index:1}

/* サイドパネル */
#side{width:300px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
#side-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#side-title{font-size:12px;font-weight:700;color:var(--text-s)}
#side-count{font-size:12px;color:var(--text-t)}
#list{overflow-y:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.item:hover{background:var(--surf)}
.item.sel{background:var(--accent-light)}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px}
.item-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
.item-dist{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap;flex-shrink:0}
.item-genre{font-size:10px;color:var(--text-t);margin-bottom:3px}
.item-addr{font-size:10px;color:var(--text-s);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-stars{display:flex;gap:8px;font-size:10px}
.star-row{display:flex;align-items:center;gap:2px}
.star-label{color:var(--text-t)}
.stars{color:var(--amber)}
.visited-badge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--green-light);color:var(--green-text);font-weight:700}
.unvisited-badge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--surf);color:var(--text-t);font-weight:700}

/* ポップアップ */
.lf-popup .lf-popup-content-wrapper{border-radius:var(--r)!important;border:1px solid var(--border)!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important;padding:0!important;overflow:hidden}
.lf-popup .lf-popup-tip-container{display:none}
.pop{width:280px;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
.pop-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--card)}
.pop-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.pop-genre{font-size:11px;color:var(--text-t)}
.pop-body{padding:10px 14px;background:var(--card)}
.pop-row{display:flex;gap:6px;margin-bottom:6px;font-size:12px;align-items:flex-start}
.pop-lbl{color:var(--text-t);width:52px;flex-shrink:0;padding-top:1px}
.pop-val{color:var(--text);flex:1;line-height:1.5}
.pop-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.plink{font-size:11px;padding:4px 9px;border-radius:var(--rs);border:1px solid var(--border-mid);text-decoration:none;color:var(--text-s);background:var(--surf);transition:all .15s;display:inline-flex;align-items:center;gap:3px}
.plink:hover{background:var(--border)}
.pop-review{margin-top:8px;padding:8px 10px;background:var(--surf);border-radius:var(--rs);font-size:11px;color:var(--text-s);line-height:1.6}
.pop-review-label{font-size:10px;font-weight:700;color:var(--text-t);margin-bottom:3px}

/* スマホ対応 */
@media(max-width:640px){
  #side{position:absolute;bottom:0;left:0;right:0;width:100%;height:45%;border-left:none;border-top:1px solid var(--border);z-index:500;transform:translateY(0)}
  #side.hidden{transform:translateY(100%)}
  #map{height:100%}
  #toggle-side{display:flex}
}
#toggle-side{display:none;position:absolute;bottom:10px;right:10px;z-index:600;background:var(--card);border:1px solid var(--border-mid);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--text-s);cursor:pointer;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ローディング */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
#loading-text{font-size:14px;color:var(--text-s)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#error-msg{display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent-light);border:1px solid var(--accent);color:var(--accent-text);padding:8px 16px;border-radius:var(--rs);font-size:13px;z-index:9999}

/* モーダル */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
#modal{background:var(--card);border-radius:var(--r);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
#modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
#modal-title{font-size:15px;font-weight:700;color:var(--text)}
#modal-close{font-size:18px;cursor:pointer;color:var(--text-t);background:none;border:none;padding:4px 8px}
#modal-body{padding:16px}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:var(--text-s);margin-bottom:4px;display:block}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border-mid);border-radius:var(--rs);font-size:13px;background:var(--surf);color:var(--text);font-family:inherit}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.btn-primary{flex:1;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer}
.btn-primary:hover{opacity:0.9}
.btn-secondary{padding:10px 16px;background:transparent;color:var(--text-s);border:1px solid var(--border-mid);border-radius:var(--rs);font-size:13px;cursor:pointer}
.btn-secondary:hover{background:var(--surf)}
#form-status{font-size:12px;text-align:center;margin-top:8px;color:var(--green);min-height:18px}
#form-status.error{color:var(--accent)}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">データを読み込んでいます...</div>
</div>
<div id="error-msg"></div>

<div id="app">
  <div id="header">
    <div id="header-top">
      <div id="app-title" style="white-space:nowrap">🗺 グルメ検索</div>
      <input id="search-box" type="text" placeholder="🔍 店名で検索..." oninput="searchShops(this.value)"
        style="flex:1;padding:5px 10px;border:1px solid var(--border-mid);border-radius:20px;font-size:12px;background:var(--surf);color:var(--text);font-family:inherit;min-width:0">
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button id="add-btn" onclick="openAddForm()" style="font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--green);color:var(--green);background:transparent;cursor:pointer;white-space:nowrap">＋</button>
        <button id="loc-btn" onclick="getLocation()">📍</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
      <div id="region-tabs" style="display:flex;gap:4px;flex-wrap:wrap;flex:1">
        <button class="rbtn active" data-region="すべて" onclick="switchRegion('すべて')">すべて</button>
        <button class="rbtn" data-region="大阪" onclick="switchRegion('大阪')">大阪</button>
        <button class="rbtn" data-region="近畿" onclick="switchRegion('近畿')">近畿</button>
        <button class="rbtn" data-region="東海" onclick="switchRegion('東海')">東海</button>
        <button class="rbtn" data-region="中国" onclick="switchRegion('中国')">中国</button>
        <button class="rbtn" data-region="四国" onclick="switchRegion('四国')">四国</button>
        <button class="rbtn" data-region="北陸" onclick="switchRegion('北陸')">北陸</button>
      </div>
      <button id="filter-toggle-btn" onclick="toggleFilters()" style="font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;white-space:nowrap;flex-shrink:0">▼ 絞り込み</button>
    </div>
    <div id="filters" style="display:none">
      <button class="fbtn" id="f-wed" onclick="toggleFilter('wed')">水曜営業</button>
      <button class="fbtn" id="f-sun" onclick="toggleFilter('sun')">日曜営業</button>
      <button class="fbtn" id="f-unvisited" onclick="toggleFilter('unvisited')">未訪問のみ</button>
      <button class="fbtn" id="f-high-both" onclick="toggleFilter('highBoth')">夫婦★4↑</button>
      <button class="fbtn" id="f-high-ossan" onclick="toggleFilter('highOssan')">おっさん★4↑</button>
      <button class="fbtn" id="f-high-kozue" onclick="toggleFilter('highKozue')">こずえ☆4↑</button>
      <button class="fbtn" id="f-tabelog" onclick="toggleFilter('tabelog')">🏆食べログ3.5↑</button>
      <button class="fbtn" id="f-hall" onclick="toggleFilter('hall')">👑殿堂入り</button>
      <button class="fbtn" id="f-morning" onclick="toggleFilter('morning')">☀️モーニング</button>
      <button class="fbtn" id="f-lunch" onclick="toggleFilter('lunch')">🍱ランチ</button>
      <button class="fbtn" id="f-dinner" onclick="toggleFilter('dinner')">🌙ディナー</button>
      <div id="filter-sep"></div>
      <div style="font-size:10px;color:var(--text-t)">おっさん</div>
      <div class="star-filter" id="sf-ossan">
        <button class="sfbtn" data-who="ossan" data-star="1" onclick="toggleStar(this)">★</button>
        <button class="sfbtn" data-who="ossan" data-star="2" onclick="toggleStar(this)">★★</button>
        <button class="sfbtn" data-who="ossan" data-star="3" onclick="toggleStar(this)">★★★</button>
        <button class="sfbtn" data-who="ossan" data-star="4" onclick="toggleStar(this)">★★★★</button>
        <button class="sfbtn" data-who="ossan" data-star="5" onclick="toggleStar(this)">★★★★★</button>
      </div>
      <div id="filter-sep2" style="width:1px;height:18px;background:var(--border);flex-shrink:0"></div>
      <div style="font-size:10px;color:var(--text-t)">こずえ</div>
      <div class="star-filter" id="sf-kozue">
        <button class="sfbtn" data-who="kozue" data-star="1" onclick="toggleStar(this)">☆</button>
        <button class="sfbtn" data-who="kozue" data-star="2" onclick="toggleStar(this)">☆☆</button>
        <button class="sfbtn" data-who="kozue" data-star="3" onclick="toggleStar(this)">☆☆☆</button>
        <button class="sfbtn" data-who="kozue" data-star="4" onclick="toggleStar(this)">☆☆☆☆</button>
        <button class="sfbtn" data-who="kozue" data-star="5" onclick="toggleStar(this)">☆☆☆☆☆</button>
      </div>
    </div>
  </div>

  <div id="legend" style="background:var(--card);border-bottom:1px solid var(--border);padding:4px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--text-s)">
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0392b"></span>イートイン</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2471a3"></span>テイクアウト</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d68910"></span>イートイン/テイクアウト</span>
    <span>✓=訪問済</span>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="side">
      <div id="side-header">
        <div id="side-title">お店リスト</div>
        <div id="side-count">読込中...</div>
      </div>
      <div id="list"></div>
    </div>
    <button id="toggle-side" onclick="toggleSide()">
      <span id="toggle-icon">▲</span> リスト
    </button>
  </div>
</div>

<!-- 入力モーダル -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">お店を登録</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      <div class="form-group">
        <label class="form-label">地域 *</label>
        <select class="form-input" id="f-region">
          <option value="大阪">大阪</option>
          <option value="近畿">近畿</option>
          <option value="東海">東海</option>
          <option value="中国">中国</option>
          <option value="四国">四国</option>
          <option value="北陸">北陸</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">店舗名 *</label>
        <input class="form-input" id="f-name" type="text" placeholder="例：串カツだるま">
      </div>
      <div class="form-group">
        <label class="form-label">ジャンル</label>
        <input class="form-input" id="f-genre" type="text" placeholder="例：串揚げ、居酒屋">
      </div>
      <div class="form-group">
        <label class="form-label">住所 *</label>
        <input class="form-input" id="f-address" type="text" placeholder="例：大阪府大阪市中央区...">
      </div>
      <div class="form-group">
        <label class="form-label">電話番号</label>
        <input class="form-input" id="f-tel" type="tel" placeholder="例：06-1234-5678">
      </div>
      <div class="form-group">
        <label class="form-label">営業時間・定休日</label>
        <textarea class="form-input" id="f-hours" rows="2" placeholder="例：月〜土 11:00-22:00 日曜定休"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">利用形態</label>
          <select class="form-input" id="f-type">
            <option value="イートイン">イートイン</option>
            <option value="テイクアウト">テイクアウト</option>
            <option value="イートイン/テイクアウト">両方</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">オススメ時間帯</label>
          <select class="form-input" id="f-time">
            <option value="">なし</option>
            <option value="モーニング">モーニング</option>
            <option value="ランチ">ランチ</option>
            <option value="ディナー">ディナー</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">水曜営業</label>
          <select class="form-input" id="f-wed">
            <option value="営業" selected>営業</option>
            <option value="休み">休み</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">日曜営業</label>
          <select class="form-input" id="f-sun">
            <option value="営業" selected>営業</option>
            <option value="休み">休み</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">駐車場</label>
        <input class="form-input" id="f-parking" type="text" placeholder="例：無料10台">
      </div>
      <div class="form-group">
        <label class="form-label">特記事項</label>
        <textarea class="form-input" id="f-note" rows="2" placeholder="おすすめメニュー、値段など"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">食べログURL</label>
        <input class="form-input" id="f-tabelog" type="text" placeholder="https://tabelog.com/...">
      </div>
      <div class="form-group">
        <label class="form-label">食べログ点数</label>
        <input class="form-input" id="f-tabelog-score" type="number" step="0.01" placeholder="例：3.52">
      </div>
      <div class="form-group">
        <label class="form-label">インスタURL（お店公式）</label>
        <input class="form-input" id="f-insta" type="text" placeholder="https://www.instagram.com/...">
      </div>
      <div class="form-group">
        <label class="form-label">Instagram投稿URL</label>
        <input class="form-input" id="f-insta-post" type="text" placeholder="https://www.instagram.com/p/...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">おっさん行ってみたい度</label>
          <select class="form-input" id="f-ossan">
            <option value="">未設定</option>
            <option value="★">★</option>
            <option value="★★">★★</option>
            <option value="★★★">★★★</option>
            <option value="★★★★">★★★★</option>
            <option value="★★★★★">★★★★★</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">こずえ行ってみたい度</label>
          <select class="form-input" id="f-kozue">
            <option value="">未設定</option>
            <option value="☆">☆</option>

// 地図初期化
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([34.6937, 135.5023], 12);

    maxZoom: 18
  }).addTo(map);

// CSV解析（セル内改行対応）
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      row.push(cur); cur = '';
    } else if ((c === '\n' || (c === '\r' && text[i+1] === '\n')) && !inQ) {
      if (c === '\r') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else {
      cur += c;
    }
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  const shops = [];
  for (let i = 1; i < rows.length; i++) {
    const vals = rows[i];
    if (!vals.some(v => v.trim())) continue;
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (vals[idx] || '').trim(); });
    shops.push(obj);
  }
  return shops;
}

// 緯度経度パース（"34.698,135.499" 形式）
function parseLatLng(str) {
  if (!str) return null;
  const parts = str.split(',');
  if (parts.length < 2) return null;
  const lat = parseFloat(parts[0].trim());
  const lng = parseFloat(parts[1].trim());
  if (isNaN(lat) || isNaN(lng)) return null;
  return { lat, lng };
}

// ★☆文字列を数値に変換
function countStars(str) {
  if (!str) return 0;
  return (str.match(/[★☆]/g) || []).length;
}

// 距離計算（km）
function calcDist(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ジャンルからアイコンを返す
function getGenreIcon(genre) {
  if (!genre) return '';
  const g = genre;
  if (/かき氷|アイスクリーム|アイスモナカ|ジェラート|ソフトクリーム/.test(g)) return '🍦';
  if (/カフェ|喫茶店/.test(g)) return '☕';
  if (/コロッケ/.test(g)) return '🥔';
  if (/とんかつ|豚料理/.test(g)) return '🐷';
  if (/パン|サンドイッチ/.test(g)) return '🍞';
  if (/ラーメン|つけ麺|担々麺|うどん|そば/.test(g)) return '🍜';
  if (/海鮮/.test(g)) return '🐟';
  if (/直売/.test(g)) return '🏭';
  if (/焼き鳥|鶏料理|からあげ/.test(g)) return '🐔';
  if (/焼肉|ステーキ|しゃぶしゃぶ|すきやき|すき焼き/.test(g)) return '🐄';
  if (/中華料理|餃子/.test(g)) return '🥟';
  if (/洋菓子|ケーキ|スイーツ|和菓子/.test(g)) return '🍰';
  if (/洋食|ハンバーグ/.test(g)) return '🥩';
  if (/寿司|鮨/.test(g)) return '🍣';
  if (/カレー/.test(g)) return '🍛';
  if (/ピザ|パスタ|イタリアン/.test(g)) return '🍕';
  if (/食堂|和食|日本料理|日本食/.test(g)) return '🍱';
  if (/ハンバーガー/.test(g)) return '🍔';
  if (/天ぷら|揚げ物/.test(g)) return '🍤';
  if (/居酒屋/.test(g)) return '🍺';
  return '';
}

// 利用形態からピン色を決定
function getPinColor(shop) {

  if (type === 'テイクアウト') return '#2471a3';           // 青
  if (type === 'イートイン/テイクアウト') return '#d68910'; // 黄
  return '#c0392b';                                         // 赤（イートイン・デフォルト）
}

// ピンアイコン生成
function makeIcon(shop, isSelected) {
  const visited = !!shop['訪問日'];
  const color = isSelected ? '#6c3483' : getPinColor(shop);
  const size = isSelected ? 40 : 32;
  const genreIcon = getGenreIcon(shop['ジャンル'] || '');
  // アイコンあり→絵文字表示、訪問済→✓を右下に重ねる
  const html = `
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="17" r="14" fill="${color}" stroke="white" stroke-width="2.5" opacity="0.93"/>
        <polygon points="20,33 13,22 27,22" fill="${color}"/>
      </svg>
      <div style="position:absolute;top:2px;left:0;width:${size}px;text-align:center;font-size:${genreIcon?'13':'11'}px;line-height:${size*0.75}px;pointer-events:none">${genreIcon || (visited?'✓':'')}</div>
      ${visited && genreIcon ? `<div style="position:absolute;bottom:6px;right:-1px;background:#1e8449;color:white;border-radius:50%;width:12px;height:12px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:1px solid white">✓</div>` : ''}
    </div>`;
  return L.divIcon({
    html: html,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size+5],
    className: ''
  });
}

// フィルター適用
function applyFilters() {
  filteredShops = allShops.filter(shop => {
    if (searchQuery && !shop['店舗名'].includes(searchQuery) && !(shop['ジャンル']||'').includes(searchQuery) && !(shop['住所']||'').includes(searchQuery)) return false;
    if (filters.wed && shop['水曜営業'] !== '営業') return false;
    if (filters.sun && shop['日曜営業'] !== '営業') return false;
    if (filters.unvisited && shop['訪問日']) return false;
    if (filters.highBoth && (countStars(shop['おっさん行ってみたい度']) < 4 || countStars(shop['こずえ行ってみたい度']) < 4)) return false;
    if (filters.highOssan && countStars(shop['おっさん行ってみたい度']) < 4) return false;
    if (filters.highKozue && countStars(shop['こずえ行ってみたい度']) < 4) return false;
    if (filters.tabelog) {
      const score = parseFloat(shop['食べログ点数']);
      if (isNaN(score) || score < 3.5) return false;
    }
    if (filters.morning && shop['オススメ時間帯'] !== 'モーニング') return false;
    if (filters.lunch && shop['オススメ時間帯'] !== 'ランチ') return false;
    if (filters.dinner && shop['オススメ時間帯'] !== 'ディナー') return false;
    if (filters.hall) {
      const score = (shop['評価'] || '').replace(/[^0-9]/g, '');
      if (score !== '10') return false;
    }

    if (starFilters.ossan.length > 0) {
      const n = countStars(shop['おっさん行ってみたい度']);
      if (!starFilters.ossan.includes(n)) return false;
    }
    if (starFilters.kozue.length > 0) {
      const n = countStars(shop['こずえ行ってみたい度']);
      if (!starFilters.kozue.includes(n)) return false;
    }
    return true;
  });

  // 現在地がある場合は距離順ソート
  if (userLat !== null) {
    filteredShops.forEach(shop => {
      const pos = parseLatLng(shop['緯度経度2']);
      shop._dist = pos ? calcDist(userLat, userLng, pos.lat, pos.lng) : 9999;
    });
    filteredShops.sort((a, b) => a._dist - b._dist);
  }

  refreshMarkers();
  renderList();
}

// リスト描画
function renderList() {
  const list = document.getElementById('list');
  document.getElementById('side-count').textContent = filteredShops.length + '件';

  if (!filteredShops.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-t);font-size:13px">該当するお店がありません</div>';
    return;
  }

  list.innerHTML = filteredShops.map(shop => {
    const visited = !!shop['訪問日'];
    const dist = shop._dist !== undefined && shop._dist < 9999 ? (shop._dist < 1 ? Math.round(shop._dist*1000)+'m' : shop._dist.toFixed(1)+'km') : '';
    const ossanS = shop['おっさん行ってみたい度'] || '';
    const kozueS = shop['こずえ行ってみたい度'] || '';
    const pinColor = getPinColor(shop);
    // 旗アイコン
    const wedFlag = shop['水曜営業'] === '営業' ? '<span title="水曜営業" style="font-size:11px" translate="no">🔵水</span>' : '';
    const sunFlag = shop['日曜営業'] === '営業' ? '<span title="日曜営業" style="font-size:11px" translate="no">🔴日</span>' : '';
    // トロフィー
    const tbScore = parseFloat(shop['食べログ点数']);
    const trophy = (!isNaN(tbScore) && tbScore >= 3.5) ? `<span title="食べログ${tbScore}" style="font-size:11px">🏆</span>` : '';
    const hallBadge = ((shop['評価'] || '').replace(/[^0-9]/g, '') === '10') ? '<span style="font-size:11px" title="殿堂入り">👑</span>' : '';
    // 時間帯アイコン
    const timeIcon = {'モーニング':'☀️','ランチ':'🍱','ディナー':'🌙'}[shop['オススメ時間帯']] || '';
    // ジャンルアイコン
    const genreIcon = getGenreIcon(shop['ジャンル'] || '');
    // ピン色ドット
    const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pinColor};margin-right:3px;flex-shrink:0;vertical-align:middle"></span>`;
    const addrShort = (shop['住所'] || '').replace(/^(大阪府|京都府|兵庫県|奈良県|滋賀県|和歌山県|愛知県|三重県|徳島県)/, '');
    const shopKey = (shop['_region'] || '') + '_' + shop['ID'];
    return `<div class="item${selectedId===shopKey?' sel':''}" id="item-${shopKey}" onclick="selectShop('${shopKey}')">
      <div class="item-top">
        <div class="item-name">${dot}${genreIcon ? '<span style="font-size:13px;margin-right:2px">'+genreIcon+'</span>' : ''}${shop['店舗名'] || ''} ${timeIcon}${trophy}${hallBadge}</div>
        ${dist ? `<div class="item-dist">${dist}</div>` : ''}
      </div>
      ${addrShort ? `<div class="item-addr">${wedFlag}${sunFlag} ${addrShort}</div>` : `<div class="item-genre">${wedFlag}${sunFlag} ${shop['ジャンル'] || ''} ${visited ? '<span class="visited-badge">訪問済</span>' : '<span class="unvisited-badge">未訪問</span>'}</div>`}
      <div class="item-genre">${shop['_region'] && activeRegion==='すべて' ? '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:#1a5276;color:#fff;margin-right:3px">'+shop['_region']+'</span>' : ''}${shop['ジャンル'] || ''} ${visited ? '<span class="visited-badge">訪問済</span>' : '<span class="unvisited-badge">未訪問</span>'}</div>
      <div class="item-stars">
        <div class="star-row"><span class="star-label">おっさん</span><span class="stars">${ossanS || '─'}</span></div>
        <div class="star-row"><span class="star-label">こずえ</span><span style="color:var(--blue)">${kozueS || '─'}</span></div>
      </div>
    </div>`;
  }).join('');
}

// ポップアップから編集
function editFromPopup(id) {
  const shop = allShops.find(s => ((s['_region'] || '') + '_' + s['ID']) === id || s['ID'] === id);
  if (shop) openEditForm(shop);
}

// お店選択
function selectShop(id) {
  selectedId = id;
  const shop = filteredShops.find(s => ((s['_region'] || '') + '_' + s['ID']) === id || s['ID'] === id);
  if (!shop) return;

  // リストのハイライト
  document.querySelectorAll('.item').forEach(el => el.classList.remove('sel'));
  const item = document.getElementById('item-' + id);
  if (item) { item.classList.add('sel'); item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  // 地図移動＆ポップアップ
  const pos = parseLatLng(shop['緯度経度2']);
  if (pos && markers[id]) {
    map.setView([pos.lat, pos.lng], 16, { animate: true });
    setTimeout(() => { if(markers[id]) markers[id].openPopup(); }, 300);
  }
}

// フィルターボタン
const filterBtnMap = { wed:'f-wed', sun:'f-sun', unvisited:'f-unvisited', highBoth:'f-high-both', highOssan:'f-high-ossan', highKozue:'f-high-kozue', tabelog:'f-tabelog', morning:'f-morning', lunch:'f-lunch', dinner:'f-dinner', hall:'f-hall' };
function toggleFilter(key) {
  filters[key] = !filters[key];
  const btn = document.getElementById(filterBtnMap[key]);
  if (!btn) return;
  btn.classList.toggle('on', filters[key]);
  if (filters[key]) btn.classList.add(key);
  else btn.classList.remove(key);
  applyFilters();
  updateFilterBtnStyle();
}

// 星フィルター
function toggleStar(btn) {
  const who = btn.dataset.who;
  const star = parseInt(btn.dataset.star);
  const arr = starFilters[who];
  const idx = arr.indexOf(star);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(star);
  btn.classList.toggle('on', idx < 0);
  applyFilters();
  updateFilterBtnStyle();
}

// 現在地取得
function getLocation() {
  if (!navigator.geolocation) { alert('現在地取得に対応していません'); return; }
  const btn = document.getElementById('loc-btn');
  btn.textContent = '取得中...';
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    btn.textContent = '📍 現在地ON';
    btn.classList.add('active');
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([userLat, userLng], {
      radius: 10, fillColor: '#e74c3c', fillOpacity: 0.9,
      color: 'white', weight: 3
    }).bindTooltip('現在地', { permanent: false }).addTo(map);
    map.setView([userLat, userLng], 14, { animate: true });
    applyFilters();
  }, err => {
    btn.textContent = '📍 現在地';
    btn.classList.remove('active');
    alert('現在地を取得できませんでした');
  }, { enableHighAccuracy: true });
}

// サイドパネル開閉（スマホ）
function toggleSide() {
  sideVisible = !sideVisible;
  document.getElementById('side').classList.toggle('hidden', !sideVisible);
  document.getElementById('toggle-icon').textContent = sideVisible ? '▼' : '▲';
}

// フィルター開閉
let filtersOpen = false;
function toggleFilters() {
  filtersOpen = !filtersOpen;
  const panel = document.getElementById('filters');
  const btn = document.getElementById('filter-toggle-btn');
  panel.style.display = filtersOpen ? 'flex' : 'none';
  btn.textContent = filtersOpen ? '▲ 絞り込み' : '▼ 絞り込み';
  // アクティブなフィルターがある場合はボタンを強調
  updateFilterBtnStyle();
}

function updateFilterBtnStyle() {
  const btn = document.getElementById('filter-toggle-btn');
  if (!btn) return;
  const hasActive = Object.values(filters).some(v => v) || starFilters.ossan.length > 0 || starFilters.kozue.length > 0 || searchQuery;
  btn.style.borderColor = hasActive ? 'var(--accent)' : 'var(--border-mid)';
  btn.style.color = hasActive ? 'var(--accent)' : 'var(--text-s)';
  btn.style.background = hasActive ? 'var(--accent-light)' : 'transparent';
  const count = Object.values(filters).filter(v => v).length + (starFilters.ossan.length > 0 ? 1 : 0) + (starFilters.kozue.length > 0 ? 1 : 0);
  const arrow = filtersOpen ? '▲' : '▼';
  btn.textContent = count > 0 ? arrow + ' 絞り込み(' + count + ')' : arrow + ' 絞り込み';
}

// 店名検索
let searchQuery = '';
function searchShops(q) {
  searchQuery = q.trim();
  applyFilters();
  updateFilterBtnStyle();
}

// 地域切り替え
function switchRegion(region) {
  activeRegion = region;
  document.querySelectorAll('.rbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.region === region);
  });
  if (region === 'すべて') {
    allShops = Object.values(regionData).flat();
  } else {
    allShops = regionData[region] || [];
  }
  applyFilters();
  // 地域に応じて地図の中心を移動
  const centers = {
    'すべて': [35.0, 136.5], '大阪': [34.69, 135.50],
    '近畿': [34.85, 135.60], '東海': [35.10, 137.00],
    '中国': [34.60, 133.50], '四国': [33.80, 133.50], '北陸': [36.50, 136.60]
  };
  const zoom = region === 'すべて' ? 8 : 11;
  if (centers[region]) map.setView(centers[region], zoom, { animate: true });
}

// データ読み込み
async function loadData() {
  const total = REGIONS.length;
  let loaded = 0;
  document.getElementById('loading-text').textContent = 'データを読み込んでいます... (0/' + total + ')';
  const promises = REGIONS.map(async r => {
    try {
      const res = await fetch(r.url);
      if (!res.ok) return;
      const text = await res.text();
      const shops = parseCSV(text).filter(s => s['店舗名'] && parseLatLng(s['緯度経度2']));
      shops.forEach(s => s['_region'] = r.name);
      regionData[r.name] = shops;
      loaded++;
      document.getElementById('loading-text').textContent = 'データを読み込んでいます... (' + loaded + '/' + total + ')';
    } catch(e) {
      console.error(r.name + '読み込みエラー:', e);
    }
  });
  await Promise.all(promises);
  allShops = Object.values(regionData).flat();
  document.getElementById('loading').style.display = 'none';
  applyFilters();
}

// ===== GAS Web API =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzg_8KKjFQR9SR1So0hruHEJTf2ObFpZc5N-sARC91ZpD5Nb4B53V09c80guK779Y46/exec';

const SHEET_NAMES = { '大阪':'お店データ', '近畿':'お店データ近畿版', '東海':'お店データ東海版', '中国':'お店データ中国版', '四国':'お店データ四国版', '北陸':'お店データ北陸版' };

let formMode = 'add';
let editShopId = null;
let editShopRegion = null;

function openAddForm() {
  formMode = 'add';
  document.getElementById('modal-title').textContent = '＋ お店を登録';
  document.getElementById('form-submit-btn').textContent = '登録する';
  document.getElementById('visit-section').style.display = 'none';
  clearForm();
  document.getElementById('modal-overlay').classList.add('show');
}

function openEditForm(shop) {
  formMode = 'edit';
  editShopId = shop['ID'];
  editShopRegion = shop['_region'];
  document.getElementById('modal-title').textContent = '✏️ 訪問記録・編集';
  document.getElementById('form-submit-btn').textContent = '更新する';
  document.getElementById('visit-section').style.display = 'block';
  // 既存データを入力欄にセット
  const regionName = Object.keys(SHEET_NAMES).find(k => k === shop['_region']) || '大阪';
  document.getElementById('f-region').value = regionName;
  document.getElementById('f-name').value = shop['店舗名'] || '';
  document.getElementById('f-address').value = shop['住所'] || '';
  document.getElementById('f-genre').value = shop['ジャンル'] || '';
  document.getElementById('f-hours').value = shop['営業時間・定休日'] || '';
  document.getElementById('f-type').value = shop['利用形態'] || 'イートイン';
  document.getElementById('f-time').value = shop['オススメ時間帯'] || '';
  document.getElementById('f-wed').value = shop['水曜営業'] || '営業';
  document.getElementById('f-sun').value = shop['日曜営業'] || '営業';
  document.getElementById('f-tabelog').value = shop['食べログURL'] || '';
  document.getElementById('f-tabelog-score').value = shop['食べログ点数'] || '';
  document.getElementById('f-insta').value = shop['インスタURL'] || '';
  document.getElementById('f-insta-post').value = shop['URL'] || '';
  document.getElementById('f-tel').value = shop['電話番号'] || '';
  document.getElementById('f-ossan').value = shop['おっさん行ってみたい度'] || '';
  document.getElementById('f-kozue').value = (shop['こずえ行ってみたい度'] || '').replace(/★/g, '☆');
  document.getElementById('f-parking').value = shop['駐車場'] || '';
  document.getElementById('f-note').value = shop['特記事項'] || '';
  document.getElementById('f-visit-date').value = shop['訪問日'] || '';
  document.getElementById('f-eval').value = shop['評価'] || '';
  document.getElementById('f-review').value = shop['感想'] || '';
  document.getElementById('modal-overlay').classList.add('show');
}

function clearForm() {
  ['f-name','f-address','f-genre','f-hours','f-tabelog','f-tabelog-score',
   'f-insta','f-insta-post','f-tel','f-parking','f-note','f-visit-date','f-eval','f-review']
  .forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('f-region').value = '大阪';
  document.getElementById('f-type').value = 'イートイン';
  document.getElementById('f-time').value = '';
  document.getElementById('f-wed').value = '営業';
  document.getElementById('f-sun').value = '営業';
  document.getElementById('f-ossan').value = '';
  document.getElementById('f-kozue').value = '';
  document.getElementById('form-status').textContent = '';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

async function submitForm() {
  const name = document.getElementById('f-name').value.trim();
  const address = document.getElementById('f-address').value.trim();
  if (!name) { showFormStatus('店舗名を入力してください', true); return; }
  if (formMode === 'add' && !address) { showFormStatus('住所を入力してください', true); return; }

  const regionKey = document.getElementById('f-region').value;
  const sheetName = SHEET_NAMES[regionKey] || '大阪版';

  const fields = [
    { key: '店舗名', value: name },
    { key: '住所', value: address },
    { key: 'ジャンル', value: document.getElementById('f-genre').value },
    { key: '営業時間・定休日', value: document.getElementById('f-hours').value },
    { key: '利用形態', value: document.getElementById('f-type').value },
    { key: 'オススメ時間帯', value: document.getElementById('f-time').value },
    { key: '水曜営業', value: document.getElementById('f-wed').value },
    { key: '日曜営業', value: document.getElementById('f-sun').value },
    { key: '食べログURL', value: document.getElementById('f-tabelog').value },
    { key: '食べログ点数', value: document.getElementById('f-tabelog-score').value },
    { key: 'インスタURL', value: document.getElementById('f-insta').value },
    { key: 'URL', value: document.getElementById('f-insta-post').value },
    { key: '電話番号', value: document.getElementById('f-tel').value },
    { key: 'おっさん行ってみたい度', value: document.getElementById('f-ossan').value },
    { key: 'こずえ行ってみたい度', value: document.getElementById('f-kozue').value },
    { key: '駐車場', value: document.getElementById('f-parking').value },
    { key: '特記事項', value: document.getElementById('f-note').value },
    { key: '訪問日', value: document.getElementById('f-visit-date').value },
    { key: '評価', value: document.getElementById('f-eval').value },
    { key: '感想', value: document.getElementById('f-review').value },
  ];

  const btn = document.getElementById('form-submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中...';
  showFormStatus('');

  try {
    const body = formMode === 'add'
      ? { action: 'addShop', sheetName, fields }
      : { action: 'updateShop', sheetName, id: editShopId, fields };

    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.status === 'ok') {
      showFormStatus(formMode === 'add' ? '✅ 登録しました！地図を更新中...' : '✅ 更新しました！地図を更新中...');
      setTimeout(async () => {
        closeModal();
        await reloadData();
      }, 1500);
    } else {
      throw new Error(data.message || '不明なエラー');
    }
  } catch(e) {
    showFormStatus('❌ エラー: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = formMode === 'add' ? '登録する' : '更新する';
  }
}

function showFormStatus(msg, isError = false) {
  const el = document.getElementById('form-status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// データ再読み込み（登録・更新後）
async function reloadData() {
  const promises = REGIONS.map(async r => {
    try {
      const res = await fetch(r.url + '&t=' + Date.now());
      if (!res.ok) return;
      const text = await res.text();
      const shops = parseCSV(text).filter(s => s['店舗名'] && parseLatLng(s['緯度経度2']));
      shops.forEach(s => s['_region'] = r.name);
      regionData[r.name] = shops;
    } catch(e) { console.error(r.name + '再読み込みエラー:', e); }
  });
  await Promise.all(promises);
  if (activeRegion === 'すべて') {
    allShops = Object.values(regionData).flat();
  } else {
    allShops = regionData[activeRegion] || [];
  }
  applyFilters();
}

// 初期化
initMap();
loadData();
</script>
