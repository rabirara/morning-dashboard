<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お店マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#f7f5f0;--card:#ffffff;--border:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.2);
  --text:#1a1a18;--text-s:#5a5a55;--text-t:#9a9990;--surf:#f0efe9;
  --accent:#c0392b;--accent-light:#fdecea;--accent-text:#922b21;
  --blue:#2471a3;--blue-light:#eaf2fb;--blue-text:#1a5276;
  --green:#1e8449;--green-light:#eafaf1;--green-text:#145a32;
  --amber:#d68910;--amber-light:#fef9e7;--amber-text:#9a6208;
  --purple:#7d3c98;--purple-light:#f5eef8;--purple-text:#5b2c6f;
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181600;--card:#242420;--border:rgba(255,255,255,0.1);--border-mid:rgba(255,255,255,0.2);
  --text:#e8e6de;--text-s:#a8a69e;--text-t:#68665e;--surf:#2a2a26;
  --accent:#e74c3c;--accent-light:#3b1414;--accent-text:#f1948a;
  --blue:#5dade2;--blue-light:#1a2e42;--blue-text:#85c1e9;
  --green:#52be80;--green-light:#0e2d1a;--green-text:#82e0aa;
  --amber:#f0b040;--amber-light:#2d1f05;--amber-text:#f8c471;
  --purple:#af7ac5;--purple-light:#2d1b3d;--purple-text:#c39bd3;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ヘッダー */
#header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;flex-shrink:0;z-index:1000}
#header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
#app-title{font-size:16px;font-weight:700;color:var(--accent)}
#loc-btn{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
#loc-btn:hover{background:var(--accent-light)}
#loc-btn.active{background:var(--accent);color:#fff}

/* フィルターエリア */
#filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fbtn{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{background:var(--surf)}
.fbtn.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text)}
.fbtn.on.wed{border-color:var(--blue);background:var(--blue-light);color:var(--blue-text)}
.fbtn.on.sun{border-color:var(--green);background:var(--green-light);color:var(--green-text)}
.fbtn.on.unvisited{border-color:var(--purple);background:var(--purple-light);color:var(--purple-text)}
.star-filter{display:flex;gap:3px;align-items:center}
.sfbtn{font-size:12px;padding:3px 7px;border-radius:20px;border:1px solid var(--border-mid);background:transparent;color:var(--text-s);cursor:pointer;transition:all .15s}
.sfbtn:hover{background:var(--surf)}
.sfbtn.on{border-color:var(--amber);background:var(--amber-light);color:var(--amber-text)}
#filter-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

/* メイン */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map{flex:1;z-index:1}

/* サイドパネル */
#side{width:300px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
#side-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#side-title{font-size:12px;font-weight:700;color:var(--text-s)}
#side-count{font-size:12px;color:var(--text-t)}
#list{overflow-y:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.item:hover{background:var(--surf)}
.item.sel{background:var(--accent-light)}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px}
.item-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
.item-dist{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap;flex-shrink:0}
.item-genre{font-size:10px;color:var(--text-t);margin-bottom:3px}
.item-stars{display:flex;gap:8px;font-size:10px}
.star-row{display:flex;align-items:center;gap:2px}
.star-label{color:var(--text-t)}
.stars{color:var(--amber)}
.visited-badge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--green-light);color:var(--green-text);font-weight:700}
.unvisited-badge{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--surf);color:var(--text-t);font-weight:700}

/* ポップアップ */
.lf-popup .lf-popup-content-wrapper{border-radius:var(--r)!important;border:1px solid var(--border)!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important;padding:0!important;overflow:hidden}
.lf-popup .lf-popup-tip-container{display:none}
.pop{width:280px;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
.pop-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--card)}
.pop-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.pop-genre{font-size:11px;color:var(--text-t)}
.pop-body{padding:10px 14px;background:var(--card)}
.pop-row{display:flex;gap:6px;margin-bottom:6px;font-size:12px;align-items:flex-start}
.pop-lbl{color:var(--text-t);width:52px;flex-shrink:0;padding-top:1px}
.pop-val{color:var(--text);flex:1;line-height:1.5}
.pop-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.plink{font-size:11px;padding:4px 9px;border-radius:var(--rs);border:1px solid var(--border-mid);text-decoration:none;color:var(--text-s);background:var(--surf);transition:all .15s;display:inline-flex;align-items:center;gap:3px}
.plink:hover{background:var(--border)}
.pop-review{margin-top:8px;padding:8px 10px;background:var(--surf);border-radius:var(--rs);font-size:11px;color:var(--text-s);line-height:1.6}
.pop-review-label{font-size:10px;font-weight:700;color:var(--text-t);margin-bottom:3px}

/* スマホ対応 */
@media(max-width:640px){
  #side{position:absolute;bottom:0;left:0;right:0;width:100%;height:45%;border-left:none;border-top:1px solid var(--border);z-index:500;transform:translateY(0)}
  #side.hidden{transform:translateY(100%)}
  #map{height:100%}
  #toggle-side{display:flex}
}
#toggle-side{display:none;position:absolute;bottom:10px;right:10px;z-index:600;background:var(--card);border:1px solid var(--border-mid);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--text-s);cursor:pointer;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ローディング */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
#loading-text{font-size:14px;color:var(--text-s)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#error-msg{display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent-light);border:1px solid var(--accent);color:var(--accent-text);padding:8px 16px;border-radius:var(--rs);font-size:13px;z-index:9999}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">データを読み込んでいます...</div>
</div>
<div id="error-msg"></div>

<div id="app">
  <div id="header">
    <div id="header-top">
      <div id="app-title">🗺 お店マップ 大阪版</div>
      <button id="loc-btn" onclick="getLocation()">📍 現在地</button>
    </div>
    <div id="filters">
      <button class="fbtn" id="f-wed" onclick="toggleFilter('wed')">水曜営業</button>
      <button class="fbtn" id="f-sun" onclick="toggleFilter('sun')">日曜営業</button>
      <button class="fbtn" id="f-unvisited" onclick="toggleFilter('unvisited')">未訪問のみ</button>
      <button class="fbtn" id="f-high-ossan" onclick="toggleFilter('highOssan')">おっさん★4↑</button>
      <button class="fbtn" id="f-high-kozue" onclick="toggleFilter('highKozue')">こずえ★4↑</button>
      <button class="fbtn" id="f-tabelog" onclick="toggleFilter('tabelog')">🏆食べログ3.5↑</button>
      <button class="fbtn" id="f-morning" onclick="toggleFilter('morning')">☀️モーニング</button>
      <button class="fbtn" id="f-lunch" onclick="toggleFilter('lunch')">🍱ランチ</button>
      <button class="fbtn" id="f-dinner" onclick="toggleFilter('dinner')">🌙ディナー</button>
      <div id="filter-sep"></div>
      <div style="font-size:10px;color:var(--text-t)">おっさん</div>
      <div class="star-filter" id="sf-ossan">
        <button class="sfbtn" data-who="ossan" data-star="1" onclick="toggleStar(this)">★</button>
        <button class="sfbtn" data-who="ossan" data-star="2" onclick="toggleStar(this)">★★</button>
        <button class="sfbtn" data-who="ossan" data-star="3" onclick="toggleStar(this)">★★★</button>
        <button class="sfbtn" data-who="ossan" data-star="4" onclick="toggleStar(this)">★★★★</button>
        <button class="sfbtn" data-who="ossan" data-star="5" onclick="toggleStar(this)">★★★★★</button>
      </div>
      <div id="filter-sep2" style="width:1px;height:18px;background:var(--border);flex-shrink:0"></div>
      <div style="font-size:10px;color:var(--text-t)">こずえ</div>
      <div class="star-filter" id="sf-kozue">
        <button class="sfbtn" data-who="kozue" data-star="1" onclick="toggleStar(this)">★</button>
        <button class="sfbtn" data-who="kozue" data-star="2" onclick="toggleStar(this)">★★</button>
        <button class="sfbtn" data-who="kozue" data-star="3" onclick="toggleStar(this)">★★★</button>
        <button class="sfbtn" data-who="kozue" data-star="4" onclick="toggleStar(this)">★★★★</button>
        <button class="sfbtn" data-who="kozue" data-star="5" onclick="toggleStar(this)">★★★★★</button>
      </div>
    </div>
  </div>

  <div id="legend" style="background:var(--card);border-bottom:1px solid var(--border);padding:4px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--text-s)">
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0392b"></span>イートイン</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2471a3"></span>テイクアウト</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d68910"></span>イートイン/テイクアウト</span>
    <span>✓=訪問済</span>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="side">
      <div id="side-header">
        <div id="side-title">お店リスト</div>
        <div id="side-count">読込中...</div>
      </div>
      <div id="list"></div>
    </div>
    <button id="toggle-side" onclick="toggleSide()">
      <span id="toggle-icon">▲</span> リスト
    </button>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5WOAy1hG7Zr0Jol_LgfXJR9pUWUlI4rKk6AUTqx-BKfZBtpFzl-i1XEAaDdB_NEiccUZhBba1GCNM/pub?gid=0&single=true&output=csv';

let allShops = [];
let filteredShops = [];
let markers = {};
let map;
let userLat = null, userLng = null;
let userMarker = null;
let selectedId = null;
let sideVisible = true;

const filters = { wed: false, sun: false, unvisited: false, highOssan: false, highKozue: false, tabelog: false, morning: false, lunch: false, dinner: false };
const starFilters = { ossan: [], kozue: [] };

// 地図初期化
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([34.6937, 135.5023], 12);
  L.tileLayer('https://tile.openstreetmap.jp/styles/osm-bright/512/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
    tileSize: 512,
    zoomOffset: -1
  }).addTo(map);
}

// CSV解析（セル内改行対応）
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      row.push(cur); cur = '';
    } else if ((c === '\n' || (c === '\r' && text[i+1] === '\n')) && !inQ) {
      if (c === '\r') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else {
      cur += c;
    }
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  const shops = [];
  for (let i = 1; i < rows.length; i++) {
    const vals = rows[i];
    if (!vals.some(v => v.trim())) continue;
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (vals[idx] || '').trim(); });
    shops.push(obj);
  }
  return shops;
}

// 緯度経度パース（"34.698,135.499" 形式）
function parseLatLng(str) {
  if (!str) return null;
  const parts = str.split(',');
  if (parts.length < 2) return null;
  const lat = parseFloat(parts[0].trim());
  const lng = parseFloat(parts[1].trim());
  if (isNaN(lat) || isNaN(lng)) return null;
  return { lat, lng };
}

// ★文字列を数値に変換
function countStars(str) {
  if (!str) return 0;
  return (str.match(/★/g) || []).length;
}

// 距離計算（km）
function calcDist(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ジャンルからアイコンを返す
function getGenreIcon(genre) {
  if (!genre) return '';
  const g = genre;
  if (/かき氷|アイスクリーム|アイスモナカ|ジェラート|ソフトクリーム/.test(g)) return '🍦';
  if (/カフェ|喫茶店/.test(g)) return '☕';
  if (/コロッケ/.test(g)) return '🥔';
  if (/とんかつ|豚料理/.test(g)) return '🐷';
  if (/パン|サンドイッチ/.test(g)) return '🍞';
  if (/ラーメン|つけ麺|担々麺|うどん|そば/.test(g)) return '🍜';
  if (/海鮮/.test(g)) return '🐟';
  if (/直売/.test(g)) return '🏭';
  if (/焼き鳥|鶏料理|からあげ/.test(g)) return '🐔';
  if (/焼肉|ステーキ|しゃぶしゃぶ|すきやき|すき焼き/.test(g)) return '🐄';
  if (/中華料理|餃子/.test(g)) return '🥟';
  if (/洋菓子|ケーキ|スイーツ|和菓子/.test(g)) return '🍰';
  if (/洋食|ハンバーグ/.test(g)) return '🥩';
  if (/寿司|鮨/.test(g)) return '🍣';
  if (/カレー/.test(g)) return '🍛';
  if (/ピザ|パスタ|イタリアン/.test(g)) return '🍕';
  if (/食堂|和食|日本料理|日本食/.test(g)) return '🍱';
  if (/ハンバーガー/.test(g)) return '🍔';
  if (/天ぷら|揚げ物/.test(g)) return '🍤';
  if (/居酒屋/.test(g)) return '🍺';
  return '';
}

// 利用形態からピン色を決定
function getPinColor(shop) {
  const type = (shop['利用形態'] || '').trim();
  if (type === 'テイクアウト') return '#2471a3';           // 青
  if (type === 'イートイン/テイクアウト') return '#d68910'; // 黄
  return '#c0392b';                                         // 赤（イートイン・デフォルト）
}

// ピンアイコン生成
function makeIcon(shop, isSelected) {
  const visited = !!shop['訪問日'];
  const color = isSelected ? '#6c3483' : getPinColor(shop);
  const size = isSelected ? 40 : 32;
  const genreIcon = getGenreIcon(shop['ジャンル'] || '');
  // アイコンあり→絵文字表示、訪問済→✓を右下に重ねる
  const html = `
    <div style="position:relative;width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="17" r="14" fill="${color}" stroke="white" stroke-width="2.5" opacity="0.93"/>
        <polygon points="20,33 13,22 27,22" fill="${color}"/>
      </svg>
      <div style="position:absolute;top:2px;left:0;width:${size}px;text-align:center;font-size:${genreIcon?'13':'11'}px;line-height:${size*0.75}px;pointer-events:none">${genreIcon || (visited?'✓':'')}</div>
      ${visited && genreIcon ? `<div style="position:absolute;bottom:6px;right:-1px;background:#1e8449;color:white;border-radius:50%;width:12px;height:12px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:1px solid white">✓</div>` : ''}
    </div>`;
  return L.divIcon({
    html: html,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size+5],
    className: ''
  });
}

// ピン更新
function refreshMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  filteredShops.forEach(shop => {
    const pos = parseLatLng(shop['緯度経度2']);
    if (!pos) return;
    const m = L.marker([pos.lat, pos.lng], { icon: makeIcon(shop, false) });

    const visited = !!shop['訪問日'];
    const ossanStars = shop['おっさん行ってみたい度'] || '';
    const kozueStars = shop['こずえ行ってみたい度'] || '';
    const instUrl = shop['インスタURL'];
    const tbUrl = shop['食べログURL'];
    const gmUrl = shop['googleマップURL'];
    const hasReview = shop['感想'] || shop['評価'];

    const popHtml = `
      <div class="pop">
        <div class="pop-head">
          <div class="pop-name">${shop['店舗名'] || ''}</div>
          <div class="pop-genre">${shop['ジャンル'] || ''} ${visited ? '<span class="visited-badge">訪問済</span>' : '<span class="unvisited-badge">未訪問</span>'}
            ${(!isNaN(parseFloat(shop['食べログ点数'])) && parseFloat(shop['食べログ点数']) >= 3.5) ? '<span style="font-size:10px;margin-left:4px">🏆'+shop['食べログ点数']+'</span>' : (shop['食べログ点数'] ? '<span style="font-size:10px;color:#999;margin-left:4px">'+shop['食べログ点数']+'</span>' : '')}
          </div>
        </div>
        <div class="pop-body">
          ${shop['ジャンル'] ? `<div class="pop-row"><span class="pop-lbl">ジャンル</span><span class="pop-val">${shop['ジャンル']}</span></div>` : ''}
          <div class="pop-row"><span class="pop-lbl">利用形態</span><span class="pop-val" style="color:${getPinColor(shop)};font-weight:700">${shop['利用形態'] || ''}</span></div>
          <div class="pop-row"><span class="pop-lbl">住所</span><span class="pop-val">${shop['住所'] || ''}</span></div>
          <div class="pop-row"><span class="pop-lbl">営業</span><span class="pop-val">${(shop['営業時間・定休日'] || '').slice(0,80)}${(shop['営業時間・定休日']||'').length>80?'...':''}</span></div>
          ${shop['駐車場'] ? `<div class="pop-row"><span class="pop-lbl">駐車場</span><span class="pop-val">${shop['駐車場']}</span></div>` : ''}
          ${shop['特記事項'] ? `<div class="pop-row"><span class="pop-lbl">特記事項</span><span class="pop-val" style="color:var(--accent)">${shop['特記事項']}</span></div>` : ''}
          <div class="pop-row">
            <span class="pop-lbl">行きたい度</span>
            <span class="pop-val">
              おっさん <span style="color:var(--amber)">${ossanStars || '─'}</span>
              こずえ <span style="color:var(--amber)">${kozueStars || '─'}</span>
            </span>
          </div>
          ${hasReview ? `<div class="pop-review"><div class="pop-review-label">📝 感想・評価</div>${shop['評価'] ? '評価: ' + shop['評価'] + '<br>' : ''}${shop['感想'] || ''}</div>` : ''}
          <div class="pop-links">
            ${shop['URL'] ? `<a class="plink" href="${shop['URL']}" target="_blank">📸 Instagram投稿</a>` : ''}
            ${instUrl ? `<a class="plink" href="${instUrl}" target="_blank">📷 インスタ</a>` : ''}
            ${tbUrl ? `<a class="plink" href="${tbUrl}" target="_blank">🍽 食べログ</a>` : ''}
            ${gmUrl ? `<a class="plink" href="${gmUrl}" target="_blank">🗺 地図</a>` : ''}
            ${shop['電話番号'] ? `<a class="plink" href="tel:${shop['電話番号']}">📞 電話</a>` : ''}
          </div>
        </div>
      </div>`;

    m.bindPopup(popHtml, { maxWidth: 300, className: 'lf-popup' });
    m.on('click', () => selectShop(shop['ID']));
    m.addTo(map);
    markers[shop['ID']] = m;
  });
}

// フィルター適用
function applyFilters() {
  filteredShops = allShops.filter(shop => {
    if (filters.wed && shop['水曜営業'] !== '営業') return false;
    if (filters.sun && shop['日曜営業'] !== '営業') return false;
    if (filters.unvisited && shop['訪問日']) return false;
    if (filters.highOssan && countStars(shop['おっさん行ってみたい度']) < 4) return false;
    if (filters.highKozue && countStars(shop['こずえ行ってみたい度']) < 4) return false;
    if (filters.tabelog) {
      const score = parseFloat(shop['食べログ点数']);
      if (isNaN(score) || score < 3.5) return false;
    }
    if (filters.morning && shop['オススメ時間帯'] !== 'モーニング') return false;
    if (filters.lunch && shop['オススメ時間帯'] !== 'ランチ') return false;
    if (filters.dinner && shop['オススメ時間帯'] !== 'ディナー') return false;

    if (starFilters.ossan.length > 0) {
      const n = countStars(shop['おっさん行ってみたい度']);
      if (!starFilters.ossan.includes(n)) return false;
    }
    if (starFilters.kozue.length > 0) {
      const n = countStars(shop['こずえ行ってみたい度']);
      if (!starFilters.kozue.includes(n)) return false;
    }
    return true;
  });

  // 現在地がある場合は距離順ソート
  if (userLat !== null) {
    filteredShops.forEach(shop => {
      const pos = parseLatLng(shop['緯度経度2']);
      shop._dist = pos ? calcDist(userLat, userLng, pos.lat, pos.lng) : 9999;
    });
    filteredShops.sort((a, b) => a._dist - b._dist);
  }

  refreshMarkers();
  renderList();
}

// リスト描画
function renderList() {
  const list = document.getElementById('list');
  document.getElementById('side-count').textContent = filteredShops.length + '件';

  if (!filteredShops.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-t);font-size:13px">該当するお店がありません</div>';
    return;
  }

  list.innerHTML = filteredShops.map(shop => {
    const visited = !!shop['訪問日'];
    const dist = shop._dist !== undefined && shop._dist < 9999 ? (shop._dist < 1 ? Math.round(shop._dist*1000)+'m' : shop._dist.toFixed(1)+'km') : '';
    const ossanS = shop['おっさん行ってみたい度'] || '';
    const kozueS = shop['こずえ行ってみたい度'] || '';
    const pinColor = getPinColor(shop);
    // 旗アイコン
    const wedFlag = shop['水曜営業'] === '営業' ? '<span title="水曜営業" style="font-size:11px" translate="no">🔵水</span>' : '';
    const sunFlag = shop['日曜営業'] === '営業' ? '<span title="日曜営業" style="font-size:11px" translate="no">🔴日</span>' : '';
    // トロフィー
    const tbScore = parseFloat(shop['食べログ点数']);
    const trophy = (!isNaN(tbScore) && tbScore >= 3.5) ? `<span title="食べログ${tbScore}" style="font-size:11px">🏆</span>` : '';
    // 時間帯アイコン
    const timeIcon = {'モーニング':'☀️','ランチ':'🍱','ディナー':'🌙'}[shop['オススメ時間帯']] || '';
    // ジャンルアイコン
    const genreIcon = getGenreIcon(shop['ジャンル'] || '');
    // ピン色ドット
    const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pinColor};margin-right:3px;flex-shrink:0;vertical-align:middle"></span>`;
    return `<div class="item${selectedId===shop['ID']?' sel':''}" id="item-${shop['ID']}" onclick="selectShop('${shop['ID']}')">
      <div class="item-top">
        <div class="item-name">${dot}${genreIcon ? '<span style="font-size:13px;margin-right:2px">'+genreIcon+'</span>' : ''}${shop['店舗名'] || ''} ${timeIcon}${trophy}</div>
        ${dist ? `<div class="item-dist">${dist}</div>` : ''}
      </div>
      <div class="item-genre">${wedFlag}${sunFlag} ${shop['ジャンル'] || ''} ${visited ? '<span class="visited-badge">訪問済</span>' : '<span class="unvisited-badge">未訪問</span>'}</div>
      <div class="item-stars">
        <div class="star-row"><span class="star-label">おっさん</span><span class="stars">${ossanS || '─'}</span></div>
        <div class="star-row"><span class="star-label">こずえ</span><span class="stars">${kozueS || '─'}</span></div>
      </div>
    </div>`;
  }).join('');
}

// お店選択
function selectShop(id) {
  selectedId = id;
  const shop = filteredShops.find(s => s['ID'] === id);
  if (!shop) return;

  // リストのハイライト
  document.querySelectorAll('.item').forEach(el => el.classList.remove('sel'));
  const item = document.getElementById('item-' + id);
  if (item) { item.classList.add('sel'); item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  // 地図移動＆ポップアップ
  const pos = parseLatLng(shop['緯度経度2']);
  if (pos && markers[id]) {
    map.setView([pos.lat, pos.lng], 16, { animate: true });
    setTimeout(() => markers[id].openPopup(), 300);
  }
}

// フィルターボタン
const filterBtnMap = { wed:'f-wed', sun:'f-sun', unvisited:'f-unvisited', highOssan:'f-high-ossan', highKozue:'f-high-kozue', tabelog:'f-tabelog', morning:'f-morning', lunch:'f-lunch', dinner:'f-dinner' };
function toggleFilter(key) {
  filters[key] = !filters[key];
  const btn = document.getElementById(filterBtnMap[key]);
  if (!btn) return;
  btn.classList.toggle('on', filters[key]);
  if (filters[key]) btn.classList.add(key);
  else btn.classList.remove(key);
  applyFilters();
}

// 星フィルター
function toggleStar(btn) {
  const who = btn.dataset.who;
  const star = parseInt(btn.dataset.star);
  const arr = starFilters[who];
  const idx = arr.indexOf(star);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(star);
  btn.classList.toggle('on', idx < 0);
  applyFilters();
}

// 現在地取得
function getLocation() {
  if (!navigator.geolocation) { alert('現在地取得に対応していません'); return; }
  const btn = document.getElementById('loc-btn');
  btn.textContent = '取得中...';
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    btn.textContent = '📍 現在地ON';
    btn.classList.add('active');
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([userLat, userLng], {
      radius: 10, fillColor: '#e74c3c', fillOpacity: 0.9,
      color: 'white', weight: 3
    }).bindTooltip('現在地', { permanent: false }).addTo(map);
    map.setView([userLat, userLng], 14, { animate: true });
    applyFilters();
  }, err => {
    btn.textContent = '📍 現在地';
    btn.classList.remove('active');
    alert('現在地を取得できませんでした');
  }, { enableHighAccuracy: true });
}

// サイドパネル開閉（スマホ）
function toggleSide() {
  sideVisible = !sideVisible;
  document.getElementById('side').classList.toggle('hidden', !sideVisible);
  document.getElementById('toggle-icon').textContent = sideVisible ? '▼' : '▲';
}

// データ読み込み
async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('取得失敗');
    const text = await res.text();
    allShops = parseCSV(text).filter(s => s['店舗名'] && parseLatLng(s['緯度経度2']));
    document.getElementById('loading').style.display = 'none';
    applyFilters();
  } catch(e) {
    document.getElementById('loading-text').textContent = 'データの読み込みに失敗しました。しばらく後に再読込してください。';
    console.error(e);
  }
}

// 初期化
initMap();
loadData();
</script>
